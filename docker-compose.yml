# JobScout — 2 services: FastAPI backend + Streamlit frontend.
# Shared network; SQLite DB persisted in a named volume.
# Health checks disabled to avoid Docker 24.0.2 daemon crash bug.

services:
  backend:
    build: ./backend
    container_name: jobscout-backend
    env_file: .env
    environment:
      DB_PATH: /data/jobs.db
      # Override defaults here if desired:
      # SCORING_MODEL: anthropic/claude-haiku-4.5
      # REFRESH_INTERVAL_HOURS: "6"
      # RUN_ON_STARTUP: "true"
      # SCORING_CONCURRENCY: "4"
    volumes:
      - jobscout-data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      disable: true
    networks:
      - jobscout-net

  frontend:
    build: ./frontend
    container_name: jobscout-frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      disable: true
    networks:
      - jobscout-net

volumes:
  jobscout-data:

networks:
  jobscout-net:
    driver: bridge
