# JobScout — FastAPI backend + HTMX/Jinja2 webui, SQLite persisted in a named volume.
#
# Quickstart:
#   cp .env.example .env   # then fill in at least one scoring provider key
#   docker compose up -d --build
#   open http://localhost:8502
#
# Health checks are disabled here to avoid a Docker 24.0.2 daemon crash bug on
# some NAS/embedded distros — see scripts/healthcheck.sh for an external probe.

services:
  backend:
    build: ./backend
    container_name: jobscout-backend
    env_file: .env
    environment:
      DB_PATH: /data/jobs.db
    volumes:
      - jobscout-data:/data
      # "Config chaude" — blacklist.json, scoring_prompt.txt, geo_scope.json,
      # settings.json, secrets.json. Editable live via the Paramètres page
      # (or by hand + POST /config/reload), no rebuild needed.
      - ./config:/app/config
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      disable: true
    networks:
      - jobscout-net

  webui:
    build: ./webui
    container_name: jobscout-webui
    environment:
      BACKEND_URL: http://backend:8000
      # Set this to require a token for write actions (see README "Read-only
      # public deployment"). Empty = full read/write access.
      JOBSCOUT_ADMIN_TOKEN: ${JOBSCOUT_ADMIN_TOKEN:-}
    ports:
      - "8502:8502"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      disable: true
    networks:
      - jobscout-net

volumes:
  jobscout-data:

networks:
  jobscout-net:
    driver: bridge
